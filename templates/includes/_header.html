<!-- Header -->
    <header class="header">
        <div class="wrap header__inner">
            <button class="icon-btn burger" data-open-categories="" aria-label="Меню категорій" data-icon="menu"><svg
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg></button>
            <a href="{% url "main:index" %}" class="logo"><img src="{{site_config.logo.url}}" alt="logo"> </a>
            <nav class="nav">
                <button class="nav__link" data-open-categories="">Категорії</button>
                <a class="nav__link" href="{% url "goods:catalog" %}">Каталог</a>

                {% for category in all_categories %}
                    {% if category.visible %}
                        <a class="nav__link" href="{% url "goods:catalog" %}?cat={{ category.slug }}">{{ category.name }}</a>
                    {% endif %}
                {% endfor %}
            </nav>
            <div class="header__actions">
                <button class="icon-btn" aria-label="Пошук" data-icon="search" data-open-search=""><svg viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg></button>
                <button class="icon-btn" data-open-cart="" aria-label="Кошик">
                    <span data-icon="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg></span>
                    <span class="cart-count" data-cart-count="" style="display: none;">0</span>
                </button>
            </div>
        </div>
    </header>
