<div id="loginModalWrapper" hx-swap-oob="outerHTML">
    {% if not request.user.is_authenticated %}
        <div class="modal auth-modal" id="loginModal">
            <div class="modal__overlay" data-close-modal=""></div>
            <div class="dialog" role="dialog" aria-modal="true" aria-label="Вхід">
                <div class="dialog__head">
                    <h3>Вхід в кабінет</h3>
                    <button class="modal__close" data-close-modal="" aria-label="Закрити">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                    </button>
                </div>
            <div>
                {% include "account/includes/login_form.html" with form=login_form %}
            </div>
            </div>
        </div>
    {% endif %}
</div>
