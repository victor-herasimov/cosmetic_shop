<div class="modal" id="categoriesModal">
    <div class="modal__overlay" data-close-modal=""></div>
    <div class="dialog" role="dialog" aria-modal="true" aria-label="Категорії">
        <div class="dialog__head">
            <h3>Категорії товарів</h3>
            <button class="modal__close" data-close-modal="" aria-label="Закрити"><svg viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg></button>
        </div>
        <div class="cat-modal-grid" id="catModalGrid">
            {% for category in all_categories %}
                <a class="cat-modal-item" href="{% url "goods:catalog" %}?cat={{ category.slug }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z">
                        </path>
                        <path d="M2 21c0-3 1.85-5.36 5.08-6"></path>
                    </svg>
                    <span>{{ category.name }}<small>{{ category.short_description }}</small></span>
                </a>
            {% empty %}
            <p>Категорії відсутні</p>
            {% endfor %}
        </div>
    </div>
</div>
