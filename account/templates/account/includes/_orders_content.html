<div class="orders-list" id="ordersGrid">
    {% if orders %}
        {% for order in orders %}
            {% include "account/includes/_card_order.html" %}
        {% endfor %}
    {% else %}
    <!-- Empty Orders State -->
    <div class="orders-empty" id="ordersEmpty">
        <div class="orders-empty__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
        </div>
        <h3 class="orders-empty__title">Замовлень не знайдено</h3>
        <p class="orders-empty__text">У вас немає замовлень із вибраним статусом.</p>
    </div>
    {% endif %}
</div>
    {% include "account/includes/_pagination_user_orders.html" %}
