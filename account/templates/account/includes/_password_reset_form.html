
<form
class="auth-form"
id="passwordResetForm"
hx-post="{% url "account:password_reset" %}"
hx-target="#passwordResetTitle"
hx-swap="outerHTML"
>
    {% include "includes/_form_non_field_error.html" %}
    <div class="form-group">
        <label for="id_reset_email">Email * </label>
        <input 
        type="text"
        name="email"
        id="id_reset_email"
        maxlength="254"
        placeholder="Введіть email"
        value="{% if form.email.value %}{{ form.email.value }}{% endif %}"
        >
        {% if form.email.errors %}
            <ul class="form-error">
                {% for error in form.email.errors %}
                    <li>{{ error }}</li>
                {% endfor %}
            </ul>
        {% endif %}
    </div>
     
    <button type="submit" class="btn btn--primary btn--block" style="margin-top: 10px;">Відновити</button>
</form>
