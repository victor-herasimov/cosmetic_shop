<!-- 4. Password -->
<div class="settings-card" id="cardPassword">
    <div class="settings-card__header">
        <div class="settings-card__icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0110 0v4"></path></svg>
        </div>
        <div>
            <h2 class="settings-card__title">Пароль</h2>
            <p class="settings-card__desc">Для безпеки використовуйте надійний пароль, що відрізняється від інших</p>
        </div>
        <button
        class="btn btn--ghost settings-card__edit-btn"
        id="editPasswordBtn"
        aria-label="Змінити пароль"
        hx-get="{% url "account:change_password" %}?type=form"
        hx-target="#cardPassword"
        hx-swap="outerHTML"
        >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
            Змінити
        </button>
    </div>

    <!-- View mode -->
    <div class="settings-card__view" id="passwordView">
        <div class="settings-info-grid">
            <div class="settings-info-item">
                <span class="settings-info-item__label">Пароль</span>
                <span class="settings-info-item__value">••••••••••••</span>
            </div>
        </div>
    </div>
</div>
