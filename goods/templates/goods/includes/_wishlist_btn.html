<button
    class="pdp__wishlist {% if product.is_favorite %}is-wishlisted{% endif %}"
    aria-label="{% if product.is_favorite %}Видалити з обраного{% else %}Додати в обране{% endif %}"
    aria-pressed="{% if product.is_favorite %}true{% else %}false{% endif %}"
    id="product-wishlist-btn-{{product.id}}"
    hx-post="{% url "wishlist:toggle" product.id %}"
    hx-target="#product-wishlist-btn-{{ product.id }}"
    hx-swap="outerHTML"
    hx-vals='{"from_detail": "true"}'
>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78L12 21.23l8.84-8.84a5.5 5.5 0 0 0 0-7.78z"></path>
    </svg>
    <span class="pdp__wishlist-label">Додати в обране</span>
</button>
