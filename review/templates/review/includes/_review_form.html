<!-- Form Container -->
<div class="review-form-container" id="reviewFormContainer">
    <div class="review-form-card">
    <h3 class="review-form__title">Ваш відгук про товар</h3>
    <form id="reviewForm">
        <div class="review-form__group">
        <span class="review-form__label">Оберіть оцінку</span>
        <div class="rating-selector">
            <input type="radio" id="star5" name="rating" value="5" class="rating-selector__input" >
            <label for="star5" class="rating-selector__star" title="5 зірок"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"></path></svg></label>
            
            <input type="radio" id="star4" name="rating" value="4" class="rating-selector__input">
            <label for="star4" class="rating-selector__star" title="4 зірки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"></path></svg></label>
            
            <input type="radio" id="star3" name="rating" value="3" class="rating-selector__input">
            <label for="star3" class="rating-selector__star" title="3 зірки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"></path></svg></label>
            
            <input type="radio" id="star2" name="rating" value="2" class="rating-selector__input">
            <label for="star2" class="rating-selector__star" title="2 зірки"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"></path></svg></label>
            
            <input type="radio" id="star1" name="rating" value="1" class="rating-selector__input" checked>
            <label for="star1" class="rating-selector__star" title="1 зірка"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.8L20 10l-6.1 1.2L12 17l-1.9-5.8L4 10l6.1-1.2z"></path></svg></label>
        </div>
        </div>

        <div class="review-form__group">
        <label for="revText" class="review-form__label">Коментар</label>
        <textarea id="revText" class="review-form__input" placeholder="Поділіться вашими враженнями від використання засобу..." required=""></textarea>
        </div>

        <button type="submit" class="btn btn--primary" id="submitReviewBtn">
        Надіслати відгук
        </button>
    </form>
    </div>
</div>
