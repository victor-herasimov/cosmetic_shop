{% if review_page_obj.has_next %}
    <div class="reviews-load-more" id="loadMoreContainer" style="display: flex;" hx-swap-oob="outerHTML">
        <button
        class="btn btn--ghost"
        id="loadMoreBtn"
        hx-get="{% url 'review:page' product.id %}?page={{ review_page_obj.next_page_number }}" 
        hx-target="#loadMoreContainer" 
        hx-swap="outerHTML"
        >
        Показати ще відгуки
    </button>
    </div>
{% endif %}
