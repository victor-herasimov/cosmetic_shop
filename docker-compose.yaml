
services:
  db:
    container_name: cosmetic_db
    image: postgres:18.0-alpine
    restart: always
    ports:
      - 5432:5432
    env_file:
      - ./.env
    volumes:
      - ./db_data:/var/lib/postgresql/18/docker/
  rabbit_mq:
    image: rabbitmq:4.2-management
    container_name: rabbitmq
    restart: always
    ports:
      - 5672:5672
      - 15672:15672
  dbbrowser:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - 8082:8080
    depends_on:
      - db
  maildev:
    image: maildev/maildev
    restart: always
    environment:
      - TZ=Europe/Kyiv
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    ports:
      - "8080:1080"
      - "8025:1025"
    logging:
      driver: "json-file"
      options:
        max-size: "1m"