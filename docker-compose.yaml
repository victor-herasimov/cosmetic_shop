
services:
  db:
    container_name: cosmetic_db
    image: postgres:18.0-alpine
    restart: always
    env_file:
      - ./.env
    volumes:
      - ./db_data:/var/lib/postgresql/18/docker/
  dbbrowser:
    image: adminer
    container_name: adminer
    ports:
      - 8082:8080
    depends_on:
      - db